<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마크다운 E-Book 리더기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- 웹폰트 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* KoPub 바탕체 (눈누 CDN) */
        @font-face {
            font-family: 'KoPubBatang';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-10-21@1.0/KoPubBatangMedium.woff') format('woff');
            font-weight: normal; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'KoPubBatang';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-10-21@1.0/KoPubBatangBold.woff') format('woff');
            font-weight: bold; font-style: normal; font-display: swap;
        }

        /* 리디바탕 (눈누 CDN) */
        @font-face {
            font-family: 'RIDIBatang';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        body { transition: background-color 0.3s, color 0.3s; }
        
        /* 렌더링된 마크다운 스타일 */
        .content-area h1 {
            text-align: center; font-size: 2.5em; font-weight: 900;
            margin-top: 1em; margin-bottom: 1em; padding-bottom: 0.5em; opacity: 0.8; border-bottom: 2px solid currentColor;
        }
        .content-area h2 { font-size: 1.6em; font-weight: bold; margin-bottom: 1em; }
        .content-area h3 { font-size: 1.3em; font-weight: bold; margin-top: 2em; margin-bottom: 0.8em; }
        .content-area p { margin-bottom: 1.5em; line-height: 1.8; text-indent: 1em; word-break: keep-all; }
        .content-area hr { border-color: currentColor; opacity: 0.2; margin: 3em 0; }
        .content-area strong { font-weight: bold; }
        .content-area em { font-style: italic; }
        .content-area blockquote { border-left: 4px solid currentColor; padding-left: 1em; margin-left: 0; opacity: 0.8; font-style: italic; }
        
        /* 테마 팔레트 */
        .theme-light { background-color: #fcfbf9; color: #333333; }
        .theme-dark { background-color: #1a1a1a; color: #e0e0e0; }
        .theme-sepia { background-color: #f4ecd8; color: #5b4636; }

        /* 폰트 및 사이즈 변수 */
        :root {
            --base-font-size: 18px;
            --base-font-family: 'RIDIBatang', serif; /* 기본값을 리디바탕으로 변경 */
        }
        .content-area {
            font-size: var(--base-font-size);
            font-family: var(--base-font-family);
        }
        
        .hidden-menu { transform: translateX(-100%); }
        .toc-active { background-color: rgba(128, 128, 128, 0.2); font-weight: bold; }

        /* 폰트 선택 드롭다운 스타일 */
        select {
            background-color: transparent; border: 1px solid currentColor;
            border-radius: 4px; padding: 2px 6px; font-size: 0.875rem;
            opacity: 0.8; outline: none; cursor: pointer;
        }
        select option { background-color: #fcfbf9; color: #333; }
        .theme-dark select option { background-color: #1a1a1a; color: #e0e0e0; }
    </style>
</head>
<body class="theme-light font-sans antialiased h-screen overflow-hidden flex">

    <!-- 목차 사이드바 -->
    <aside id="sidebar" class="w-64 h-full bg-black/5 border-r border-black/10 absolute md:relative z-20 transition-transform duration-300 hidden-menu md:transform-none backdrop-blur-md">
        <div class="p-5 h-full flex flex-col">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-xl font-bold">목차</h1>
                <button id="closeSidebarBtn" class="md:hidden text-2xl">&times;</button>
            </div>
            <!-- 목차가 동적으로 생성될 영역 -->
            <nav id="tocNav" class="flex-1 overflow-y-auto space-y-1 pr-2 pb-10">
                <p class="text-sm opacity-50 p-2">파일을 열면 목차가 생성됩니다.</p>
            </nav>
        </div>
    </aside>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 h-full flex flex-col relative">
        
        <!-- 상단 컨트롤 바 -->
        <header class="h-14 bg-black/5 flex items-center justify-between px-4 border-b border-black/10 z-10 backdrop-blur-sm shrink-0 overflow-x-auto whitespace-nowrap scrollbar-hide">
            <div class="flex items-center shrink-0">
                <button id="toggleSidebarBtn" class="p-2 rounded hover:bg-black/10 mr-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <span id="headerBookTitle" class="font-bold text-sm truncate max-w-[120px] sm:max-w-[200px] opacity-80 mr-4"></span>
            </div>
            
            <div class="flex items-center space-x-3 shrink-0">
                <button onclick="document.getElementById('fileInput').click()" class="px-3 py-1 bg-blue-500 text-white rounded shadow hover:bg-blue-600 text-sm">파일 열기</button>
                <input type="file" id="fileInput" accept=".md,.txt" class="hidden">

                <div class="w-px h-6 bg-black/20 mx-1"></div>

                <!-- 폰트 선택기 -->
                <select id="fontSelector" onchange="changeFontFamily(this.value)" class="text-sm" title="글꼴 변경">
                    <option value="'RIDIBatang', serif" selected>리디바탕</option>
                    <option value="'KoPubBatang', serif">KoPub 바탕</option>
                    <option value="'Nanum Myeongjo', serif">나눔명조</option>
                    <option value="'Malgun Gothic', sans-serif">맑은고딕 (고딕체)</option>
                </select>

                <div class="w-px h-6 bg-black/20 mx-1"></div>

                <!-- 테마 선택기 -->
                <div class="hidden sm:flex items-center space-x-1">
                    <button onclick="setTheme('theme-light')" class="w-7 h-7 rounded-full bg-[#fcfbf9] border border-gray-300 shadow-sm" title="라이트 모드"></button>
                    <button onclick="setTheme('theme-sepia')" class="w-7 h-7 rounded-full bg-[#f4ecd8] border border-gray-400 shadow-sm" title="세피아 모드"></button>
                    <button onclick="setTheme('theme-dark')" class="w-7 h-7 rounded-full bg-[#1a1a1a] border border-gray-600 shadow-sm" title="다크 모드"></button>
                </div>
                
                <div class="w-px h-6 bg-black/20 mx-1 hidden sm:block"></div>
                
                <!-- 폰트 크기 -->
                <div class="flex shrink-0">
                    <button onclick="changeFontSize(-2)" class="px-2 py-1 bg-black/10 rounded-l hover:bg-black/20 font-bold" title="글꼴 작게">A-</button>
                    <button onclick="changeFontSize(2)" class="px-2 py-1 bg-black/10 rounded-r border-l border-black/10 hover:bg-black/20 font-bold" title="글꼴 크게">A+</button>
                </div>
            </div>
        </header>

        <!-- 소설 텍스트 스크롤 영역 -->
        <article class="flex-1 overflow-y-auto p-4 sm:p-6 scroll-smooth relative" id="scrollArea">
            
            <!-- 파일 드래그 앤 드롭 영역 (초기 화면) -->
            <div id="dropZone" class="absolute inset-4 border-4 border-dashed border-gray-300 rounded-2xl flex flex-col items-center justify-center text-center cursor-pointer hover:bg-black/5 transition-colors z-0">
                <svg class="w-16 h-16 opacity-50 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <h2 class="text-2xl font-bold opacity-70 mb-2">마크다운 파일(.md) 열기</h2>
                <p class="opacity-50">여기에 파일을 드래그하거나 클릭하여 선택하세요.</p>
            </div>

            <!-- 책 내용 및 페이징 UI 컨테이너 -->
            <div id="bookContainer" class="hidden max-w-3xl mx-auto pb-20 relative z-10">
                
                <!-- 현재 챕터 렌더링 영역 -->
                <div id="viewerArea" class="content-area min-h-[50vh]"></div>
                
                <!-- 하단 네비게이션 버튼 -->
                <div id="paginationNav" class="flex justify-between items-center mt-16 pt-8 border-t border-current opacity-70">
                    <button id="prevBtn" onclick="goToChapter(currentChapterIndex - 1)" class="px-4 py-2 bg-black/10 hover:bg-black/20 rounded transition-colors disabled:opacity-20 disabled:pointer-events-none font-bold">← 이전 장</button>
                    <span id="currentChapterIndicator" class="text-sm font-bold tracking-widest">1 / 1</span>
                    <button id="nextBtn" onclick="goToChapter(currentChapterIndex + 1)" class="px-4 py-2 bg-black/10 hover:bg-black/20 rounded transition-colors disabled:opacity-20 disabled:pointer-events-none font-bold">다음 장 →</button>
                </div>
            </div>
            
        </article>
    </main>

    <script>
        /* --- 상태 관리 --- */
        let bookChapters = []; 
        let currentChapterIndex = 0; 

        /* --- 파일 처리 로직 --- */
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const bookContainer = document.getElementById('bookContainer');
        const viewerArea = document.getElementById('viewerArea');
        const tocNav = document.getElementById('tocNav');
        const scrollArea = document.getElementById('scrollArea');
        const headerBookTitle = document.getElementById('headerBookTitle');
        const fontSelector = document.getElementById('fontSelector');

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('bg-black/10', 'border-blue-400'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('bg-black/10', 'border-blue-400'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('bg-black/10', 'border-blue-400');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });

        function handleFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                processMarkdown(e.target.result);
                const cleanTitle = file.name.replace(/\.[^/.]+$/, "");
                document.title = cleanTitle;
                headerBookTitle.textContent = cleanTitle;
                
                dropZone.classList.add('hidden');
                bookContainer.classList.remove('hidden');
                
                generateTOC();
                goToChapter(0); 
            };
            reader.readAsText(file);
        }

        /* --- 마크다운 챕터 분할 로직 --- */
        function processMarkdown(mdText) {
            // 정규식: 줄 시작이 '# ' 또는 '## '일 때 그 위치를 기준으로 분할 (룩어헤드)
            const rawChunks = mdText.split(/^(?=# )|^(?=## )/m);
            bookChapters = [];
            
            rawChunks.forEach(chunk => {
                if (chunk.trim().length === 0) return;
                
                const lines = chunk.trim().split('\n');
                let title = "작품 정보 및 표지"; 
                
                if (lines[0].startsWith('#')) {
                    title = lines[0].replace(/^#+\s*/, '').trim();
                }
                
                bookChapters.push({ title: title, content: chunk });
            });
        }

        /* --- 챕터 네비게이션 로직 --- */
        function goToChapter(index) {
            if (index < 0 || index >= bookChapters.length) return;
            
            currentChapterIndex = index;
            const chapter = bookChapters[index];
            
            viewerArea.innerHTML = marked.parse(chapter.content);
            
            document.getElementById('currentChapterIndicator').textContent = `${index + 1} / ${bookChapters.length}`;
            document.getElementById('prevBtn').disabled = (index === 0);
            document.getElementById('nextBtn').disabled = (index === bookChapters.length - 1);
            
            updateTOCHighlight();
            scrollArea.scrollTop = 0; 
        }

        /* --- 목차(TOC) 로직 --- */
        function generateTOC() {
            tocNav.innerHTML = ''; 
            bookChapters.forEach((chapter, index) => {
                const btn = document.createElement('button');
                btn.textContent = chapter.title;
                btn.className = `w-full text-left p-3 rounded transition-colors truncate text-sm mb-1 hover:bg-black/10`;
                btn.id = `toc-btn-${index}`;
                btn.onclick = () => {
                    goToChapter(index);
                    closeSidebarMobile();
                };
                tocNav.appendChild(btn);
            });
        }
        
        function updateTOCHighlight() {
            const allBtns = tocNav.querySelectorAll('button');
            allBtns.forEach(btn => btn.classList.remove('toc-active'));
            const activeBtn = document.getElementById(`toc-btn-${currentChapterIndex}`);
            if (activeBtn) {
                activeBtn.classList.add('toc-active');
                activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        /* --- UI 및 설정 로직 --- */
        const sidebar = document.getElementById('sidebar');
        function toggleSidebar() { sidebar.classList.toggle('hidden-menu'); }
        function closeSidebarMobile() { if (window.innerWidth < 768) sidebar.classList.add('hidden-menu'); }
        
        document.getElementById('toggleSidebarBtn').addEventListener('click', toggleSidebar);
        document.getElementById('closeSidebarBtn').addEventListener('click', toggleSidebar);

        function setTheme(themeName) {
            document.body.classList.remove('theme-light', 'theme-dark', 'theme-sepia');
            document.body.classList.add(themeName);
            localStorage.setItem('ebookTheme', themeName);
        }

        let currentFontSize = 18;
        function changeFontSize(delta) {
            currentFontSize += delta;
            if (currentFontSize < 14) currentFontSize = 14;
            if (currentFontSize > 36) currentFontSize = 36;
            document.documentElement.style.setProperty('--base-font-size', currentFontSize + 'px');
            localStorage.setItem('ebookFontSize', currentFontSize);
        }

        // 글꼴 변경 함수
        function changeFontFamily(fontFamily) {
            document.documentElement.style.setProperty('--base-font-family', fontFamily);
            localStorage.setItem('ebookFontFamily', fontFamily);
            fontSelector.value = fontFamily;
        }

        // 초기화 로직
        window.onload = () => {
            const savedTheme = localStorage.getItem('ebookTheme');
            if (savedTheme) setTheme(savedTheme);
            
            const savedFontSize = localStorage.getItem('ebookFontSize');
            if (savedFontSize) {
                currentFontSize = parseInt(savedFontSize);
                document.documentElement.style.setProperty('--base-font-size', currentFontSize + 'px');
            }

            // localStorage에 폰트 설정이 있으면 불러오고, 없으면 기본값(리디바탕) 유지
            const savedFontFamily = localStorage.getItem('ebookFontFamily');
            if (savedFontFamily) {
                changeFontFamily(savedFontFamily);
            }
        };
    </script>
</body>
</html>
